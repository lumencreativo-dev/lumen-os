services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen_dev_2026
      POSTGRES_DB: lumen_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
